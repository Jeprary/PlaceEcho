[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "placeecho-trellis-worker"
version = "0.1.0"
description = "Isolated PlaceEcho TRELLIS 1 image-to-3D worker"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/placeecho_trellis_worker"]
